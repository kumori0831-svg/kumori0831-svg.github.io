<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopee 連携を処理中…</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           text-align: center; padding: 48px; color: #333; }
    h2 { color: #ff6f00; }
    .spinner { margin: 24px auto; width: 36px; height: 36px;
               border: 4px solid #ffe0b2; border-top-color: #ff6f00;
               border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #ff6f00; }
    code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Shopee 認可を処理中…</h2>
  <div class="spinner"></div>
  <p id="msg">ローカルダッシュボードに戻しています…</p>
  <script>
    (function () {
      var PROXY = "http://127.0.0.1:8081/api/auth/callback";
      var qs = window.location.search;
      if (!qs || qs.indexOf("code=") === -1) {
        document.getElementById("msg").innerHTML =
          "認可情報が見つかりません。ダッシュボードからやり直してください。";
        return;
      }
      var target = PROXY + qs;
      window.location.replace(target);
      setTimeout(function () {
        document.getElementById("msg").innerHTML =
          '自動で戻らない場合は <a href="' + target + '">こちらをクリック</a> してください。' +
          '<br><small>(プロキシ <code>start_proxy.cmd</code> が起動している必要があります)</small>';
      }, 2500);
    })();
  </script>
</body>
</html>
